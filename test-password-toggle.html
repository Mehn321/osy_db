<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Toggle Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl p-12 max-w-md w-full">
        <h1 class="text-3xl font-bold text-blue-900 mb-2">🔐 Password Toggle Test</h1>
        <p class="text-slate-600 mb-8">Click the eye icon to toggle password visibility</p>
        
        <div class="space-y-6">
            <!-- Test 1: Markup-based toggle -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Test 1: With Button</label>
                <div class="relative">
                    <input type="password" placeholder="Try me!" class="w-full px-4 py-3 border-2 border-slate-300 rounded-lg focus:outline-none focus:border-blue-600" />
                    <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-blue-600 toggle-password-btn transition" aria-label="Toggle password visibility">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                </div>
                <p class="text-xs text-slate-500 mt-2">Status: <span id="test1-status">Waiting...</span></p>
            </div>

            <!-- Test 2: Second field -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Test 2: Another Field</label>
                <div class="relative">
                    <input type="password" placeholder="Click the eye!" class="w-full px-4 py-3 border-2 border-slate-300 rounded-lg focus:outline-none focus:border-blue-600" />
                    <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-blue-600 toggle-password-btn transition" aria-label="Toggle password visibility">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                </div>
                <p class="text-xs text-slate-500 mt-2">Status: <span id="test2-status">Waiting...</span></p>
            </div>

            <div class="bg-blue-50 border-2 border-blue-200 rounded-lg p-4 mt-8">
                <p class="text-sm font-semibold text-blue-900 mb-2">✅ Test Results:</p>
                <p class="text-xs text-blue-800 mb-2">• All password toggles initialized: <span id="init-status" class="font-bold">Checking...</span></p>
                <p class="text-xs text-blue-800">• Eye icon should change when clicked (👁️ ↔️ 🙈)</p>
            </div>
        </div>
    </div>

    <script>
        // Test the password toggle initialization
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Page loaded, initializing password toggles...');
            
            let toggleCount = 0;
            let boundCount = 0;

            // Initialize password visibility toggles
            document.querySelectorAll('button.toggle-password-btn').forEach((btn, index) => {
                console.log(`Processing toggle button ${index + 1}`);
                
                if (btn.dataset.bound) {
                    console.log(`  → Already bound, skipping`);
                    return;
                }
                
                btn.dataset.bound = '1';
                boundCount++;
                
                const container = btn.closest('div') || btn.parentNode;
                const input = container.querySelector('input[type="password"]');
                
                if (!input) {
                    console.log(`  → No password input found, skipping`);
                    return;
                }
                
                if (input.dataset.hasToggle) {
                    console.log(`  → Input already has toggle, skipping`);
                    return;
                }
                
                input.dataset.hasToggle = '1';
                toggleCount++;
                
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log(`Toggle ${index + 1} clicked! Current type: ${input.type}`);
                    
                    if (input.type === 'password') {
                        input.type = 'text';
                        btn.innerHTML = '<span class="material-symbols-outlined">visibility_off</span>';
                        document.getElementById(`test${index + 1}-status`).textContent = '✅ Showing (click to hide)';
                        document.getElementById(`test${index + 1}-status`).className = 'text-green-600 font-bold';
                    } else {
                        input.type = 'password';
                        btn.innerHTML = '<span class="material-symbols-outlined">visibility</span>';
                        document.getElementById(`test${index + 1}-status`).textContent = '✅ Hidden (click to show)';
                        document.getElementById(`test${index + 1}-status`).className = 'text-green-600 font-bold';
                    }
                });
                
                console.log(`  ✅ Toggle ${index + 1} initialized successfully`);
            });

            // Update status
            document.getElementById('init-status').textContent = `✅ ${boundCount} buttons bound, ${toggleCount} toggles active`;
            document.getElementById('init-status').className = toggleCount === 2 ? 'text-green-600 font-bold' : 'text-orange-600 font-bold';
            
            console.log(`\n🎉 Initialization complete: ${toggleCount} password toggles ready`);
        });
    </script>
</body>
</html>
